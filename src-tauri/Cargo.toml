[package]
name = "siyak"
description = "Offline-first desktop app for reading and researching the Quran"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# see https://github.com/rust-lang/cargo/issues/8519
name = "siyak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
thiserror = "2.0.21"
# Only release candidates of specta/tauri-specta support Tauri v2; pinned exactly.
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
# The only HTTP client (net.rs); rustls, no cookies, redirects followed by hand.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
tokio = { version = "1.54.0", features = ["macros", "rt", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7.20"
bytes = "1.12.1"
sha2 = "0.11.1"
zstd = "0.14.3"
tar = { version = "0.4.46", default-features = false }
semver = "1.0.28"
fs4 = "1.1.0"
# Rust side only: the webview gets no opener permission (spec §14.3).
tauri-plugin-opener = "2.7.2"
unicode-normalization = "0.1.26"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "net"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3.34", default-features = false }

[lints]
workspace = true

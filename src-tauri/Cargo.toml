[package]
name = "siyak"
description = "Offline-first desktop app for reading and researching the Quran"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# see https://github.com/rust-lang/cargo/issues/8519
name = "siyak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
thiserror = "2.0.21"
# Only release candidates of specta/tauri-specta support Tauri v2; pinned exactly.
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

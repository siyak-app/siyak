[workspace]
members = ["src-tauri", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["Kemal Özyön and Siyak contributors"]
repository = "https://github.com/siyak/siyak"
homepage = "https://quran.kemalozyon.com"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[workspace.lints.clippy]
# Errors must become `AppError` with a stable code; only unrecoverable startup
# code may opt out, with an explicit `#[expect(..., reason = "...")]`.
unwrap_used = "warn"
expect_used = "warn"

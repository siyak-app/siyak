[workspace]
members = ["src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["Kemal Özyön and Siyak contributors"]
repository = "https://github.com/siyak/siyak"
homepage = "https://quran.kemalozyon.com"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

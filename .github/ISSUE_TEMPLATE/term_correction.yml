name: Translation or term correction
description: Report wording in the interface, a term translation or a label that should change.
labels: ["i18n"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [Türkçe, English]
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where does it appear?
      description: Screen, or the i18n key if you know it (e.g. context_panel.tabs.tafsir).
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: input
    id: proposed
    attributes:
      label: Proposed text
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason or reference
      description: e.g. established usage, a dictionary, docs/glossary.md.
